[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gbdn-research"
version = "0.1.0"
description = "Canonical learned Blaschke--Cayley graph filter-bank implementation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Research-use repository; see source and dependency licenses" }
authors = [{ name = "Anonymous" }]
dependencies = [
  "torch==2.11.0",
  "numpy==2.3.5",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["gbdn*"]
exclude = ["legacy*"]
