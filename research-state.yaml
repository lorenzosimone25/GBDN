  reasons:
    - Strict legacy reproduction verification fails with 28 reported problems.
    - The third independent review accepted 35 of 36 mandatory rows but rejected GA-00 because both public exact eigendecomposition constructors allow a large finite orthogonality tolerance to disable the theorem premise.
    - With orthogonality_atol=10, the frozen two-node nonorthogonal basis is accepted and reproduces operator unitarity defect 4.83269046506849; a fixed fail-closed tolerance and fourth review are required.
    - The repaired theory manuscript remains paper-blocked pending final Gate-A provenance and independent acceptance; its Chebyshev attribution block is resolved.
    - Official multi-split, multi-seed benchmarks and verified baselines do not exist.
    - The submission CLI, frozen run plan, official task contracts, independent metric recomputation, aggregation, renderer, verifier, and thin H100 notebook are not yet implemented.
    - The official five-dataset protocol is frozen, but dataset/array checksums, redistribution terms, adapter parity, and upstream baseline version/license evidence remain unresolved.
