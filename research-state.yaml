    - The Gate-A report mixes execution and duplicate-mapping state in its row status and still relies on unvalidated hard-coded coverage declarations; a legacy diagnostic subset can also print a false global acceptance message.
    - The repaired theory manuscript remains paper-blocked pending final Gate-A provenance and independent acceptance; its Chebyshev attribution block is resolved.
    - Official multi-split, multi-seed benchmarks and verified baselines do not exist.
